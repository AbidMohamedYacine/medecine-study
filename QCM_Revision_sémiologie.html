// ===== STATE =====
const K='qcm4courses_120_v1',$=s=>document.querySelector(s);
let S={a:{},cur:Q[0].id,theme:'',sa:false,st:0,o:null,ord:{},f:{c:0,d:'all',s:'all',h:false}},keep=false;
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
if(!S.theme)S.theme=(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const done=x=>S.a[x.id]&&S.a[x.id].done,okq=x=>done(x)&&S.a[x.id].ok,st=x=>!done(x)?'unanswered':okq(x)?'correct':'incorrect';
const E={easy:'🟢 Easy',medium:'🟠 Medium',hard:'🔴 Hard'};
function list(){const f=S.f;const ids=S.o&&S.o.length==Q.length?S.o:Q.map(x=>x.id);
return ids.map(i=>Q.find(x=>x.id==i)).filter(x=>(!f.c||x.course==f.c)&&(f.d=='all'||x.diff==f.d)&&(f.s=='all'||st(x)==f.s)&&(!f.h||x.hy))}
const acc=(a)=>a.length?Math.round(100*a.filter(okq).length/a.filter(done).length||0):0;
const pct=(c,n)=>n?(100*c/n).toFixed(1)+'%':'0%';
function go(id){S.cur=id;keep=false;save();render()}
function render(){
document.documentElement.dataset.theme=S.theme;$('#th').textContent=S.theme=='dark'?'☀️':'🌙';
$('#sa').checked=S.sa;$('#fd').value=S.f.d;$('#fs').value=S.f.s;$('#fh').checked=S.f.h;$('#fc').value=S.f.c;
$('#ct').textContent=S.f.c?'Course '+S.f.c+' — '+T[S.f.c]:'All Courses';
const sc=Q.filter(x=>!S.f.c||x.course==S.f.c),an=sc.filter(done),co=sc.filter(okq).length;
$('#stats').innerHTML=[['Answered',an.length+' / '+sc.length],['Correct',co],['Incorrect',an.length-co],['Accuracy',pct(co,an.length)],['Streak 🔥',S.st]].map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join('');
$('#pbar').style.width=(100*an.length/(sc.length||1))+'%';
$('#dash').innerHTML=[1,2,3,4].map(c=>{const a=Q.filter(x=>x.course==c),d=a.filter(done),k=a.filter(okq).length;
return `<div class="cc ${S.f.c==c?'on':''}" data-c="${c}"><b>Course ${c} — ${T[c]}</b><br><small>${d.length} / ${a.length} answered · ${k} correct · ${d.length-k} incorrect · ${pct(k,d.length)} accuracy</small><div class="pb" style="margin-top:8px"><i style="width:${100*d.length/(a.length||1)}%"></i></div></div>`}).join('');
const L=list();let cq=Q.find(x=>x.id==S.cur);if(!cq||(!L.includes(cq)&&!keep))cq=L[0];if(cq)S.cur=cq.id;
$('#nav').innerHTML=[1,2,3,4].map(c=>`<b>C${c}</b>`+L.filter(x=>x.course==c).map(x=>`<button class="nv ${st(x)} ${cq&&x.id==cq.id?'cur':''}" data-id="${x.id}">${Q.indexOf(x)+1}</button>`).join('')).join('');
// final results
if(Q.every(done)){const t=Q.length,k=Q.filter(okq).length,p=100*k/t;
const m=p>=90?'Excellent exam readiness':p>=80?'Very strong performance':p>=70?'Good foundation, revise weak areas':p>=60?'Moderate performance, targeted revision recommended':'More revision needed';
const row=(l,a)=>{const c=a.filter(okq).length;return `<li>${l}: ${c}/${a.length} correct · ${a.length-c} incorrect · ${pct(c,a.length)}</li>`};
$('#fin').innerHTML=`<div class="card"><h2>🎉 Final Results</h2><p>Total Questions: ${t} · Correct ${k} · Incorrect ${t-k} · Accuracy ${p.toFixed(1)}%</p><p><b>${m}</b></p><ul>${['easy','medium','hard'].map(d=>row(E[d],Q.filter(x=>x.diff==d))).join('')}${[1,2,3,4].map(c=>row('Course '+c,Q.filter(x=>x.course==c))).join('')}</ul></div>`}else $('#fin').innerHTML='';
if(!cq){$('#qa').innerHTML='<div class="card">No questions match the current filters.</div>';return}
const A=S.a[cq.id]||{sel:[],done:false},ix=L.indexOf(cq),dn=A.done;
if(S.sa&&!S.ord[cq.id]){S.ord[cq.id]=[0,1,2,3,4].sort(()=>Math.random()-.5);save()}
const ord=S.sa&&S.ord[cq.id]?S.ord[cq.id]:[0,1,2,3,4];
const pos=Q.indexOf(cq)+1;
let h=`<div class="card"><div class="sub" style="color:var(--mu)">Question ${pos} / ${Q.length}<br>Course ${cq.course} — ${cq.courseTitle}</div>
<div style="margin-top:8px"><span class="badge">${E[cq.diff]}</span>${cq.hy?'<span class="badge hy">⭐ HIGH YIELD</span>':''}</div><div class="q">${cq.question}</div>`;
ord.forEach((oi,p)=>{const a=cq.answers[oi],sel=A.sel.includes(oi);let c='opt'+(sel&&!dn?' sel':'');
if(dn){c+=sel&&a.correct?' good':sel&&!a.correct?' bad':a.correct?' miss':''}
h+=`<label class="${c}"><input type="checkbox" data-i="${oi}" ${sel?'checked':''} ${dn?'disabled':''}><div><b>${'ABCDE'[p]}.</b> ${a.text}${dn?`<div class="ex">${'ABCDE'[p]} ${a.correct?'✓ Correct':'✗ Incorrect'} — ${a.explanation}</div>`:''}</div></label>`});
if(dn){const need=cq.answers.filter(a=>a.correct).length,gs=A.sel.filter(i=>cq.answers[i].correct).length,bs=A.sel.length-gs;
const msg=A.ok?'Perfect — all correct propositions selected.':bs?`${gs} correct proposition(s) selected, but ${bs} incorrect proposition(s) also selected.`:`${gs} of ${need} correct propositions selected.`;
h+=`<div class="res" style="background:${A.ok?'var(--okb)':'var(--kob)'}">${A.ok?'✅':'❌'} ${msg}</div><div class="tip">🧠 <b>Memory Tip</b><br>${cq.memoryTip}</div><div class="tip">🧠 <b>What to Memorize</b><ul>${cq.memorize.map(m=>`<li>${m}</li>`).join('')}</ul></div>`}
h+=`<div class="row"><button id="pv" ${ix==0?'disabled':''}>← Previous</button>${dn?'<button id="ta">Try Again</button>':'<button class="pri" id="va">Validate Answer</button>'}<button id="nx" ${ix>=L.length-1?'disabled':''}>Next →</button></div></div>`;
$('#qa').innerHTML=h}
// ===== EVENTS =====
$('#fc').innerHTML='<option value="0">All Courses</option>'+[1,2,3,4].map(c=>`<option value="${c}">Course ${c} — ${T[c]}</option>`).join('');
const cur=()=>Q.find(x=>x.id==S.cur);
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='fc')S.f.c=+t.value;else if(t.id=='fd')S.f.d=t.value;else if(t.id=='fs')S.f.s=t.value;else if(t.id=='fh')S.f.h=t.checked;
else if(t.id=='sa'){S.sa=t.checked;S.ord={}}
else if(t.dataset.i!==undefined){const A=S.a[S.cur]||(S.a[S.cur]={sel:[],done:false}),i=+t.dataset.i;A.sel=t.checked?[...A.sel,i]:A.sel.filter(x=>x!=i);t.closest('.opt').classList.toggle('sel',t.checked);save();return}
else return;keep=false;save();render()});
document.addEventListener('click',e=>{const t=e.target,b=t.closest('button'),c=t.closest('.cc');
if(c){S.f.c=S.f.c==c.dataset.c?0:+c.dataset.c;keep=false;save();render();return}
if(!b)return;const L=list(),i=L.indexOf(cur());
if(b.dataset.id)go(+b.dataset.id);
else if(b.id=='th'){S.theme=S.theme=='dark'?'light':'dark';save();render()}
else if(b.id=='sh'){S.o=Q.map(x=>x.id).sort(()=>Math.random()-.5);keep=false;save();render()}
else if(b.id=='pv'&&i>0)go(L[i-1].id);else if(b.id=='nx'&&i<L.length-1)go(L[i+1>0?i+1:0].id);
else if(b.id=='va'){const A=S.a[S.cur]||(S.a[S.cur]={sel:[],done:false}),x=cur();
if(!A.sel.length){alert('Select at least one proposition.');return}
A.done=true;A.ok=x.answers.every((a,k)=>a.correct==A.sel.includes(k));S.st=A.ok?S.st+1:0;keep=true;save();render()}
else if(b.id=='ta'){delete S.a[S.cur];keep=true;save();render()}
else if(b.id=='rs'&&confirm('Reset ALL progress? Answers and scores for all '+Q.length+' questions across all 4 courses will be erased.')){S.a={};S.st=0;S.ord={};S.o=null;S.f={c:0,d:'all',s:'all',h:false};S.cur=Q[0].id;save();render()}});
render();
</script></body></html>
